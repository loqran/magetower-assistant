readme = "README.md"
authors = [
    { name = "loqran", email = "325322671+loqran@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
magetower-assistant = "magetower_assistant:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
