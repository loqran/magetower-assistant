# Competition assistant runtime config

[llm]
host = "http://localhost:11434"
model = "granite3.3:8b"
temperature = 0.3	# low = more consistent and methodological answers
num_ctx = 8192		# context window

[chat]
max_history_turns = 10 # context kept


[rag]
enabled = true
kb_dir = "kb"			# <kb_dir>/<corpus>/**/*.md, only `vetted: true` notes are ingested
db_path = "data/chroma"
embed_model = "nomic-embed-text"
active_corpora = []		# specialist corpora on top of baseline, e.g. ["maritime"]
top_k = 4
max_distance = 0.4		# cosine distance cutoff; relevant ~0.2-0.4, off-topic ~0.45+ (recalibrate in Stage 3)
